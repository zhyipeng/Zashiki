<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角矩形（应用图标底板） -->
  <rect width="1024" height="1024" rx="224" fill="#1a1a2e"/>

  <!-- 渐变文件夹主体 -->
  <defs>
    <linearGradient id="folderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#3F8CFF"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E8E8FF"/>
    </linearGradient>
  </defs>

  <!-- 文件夹（抽象为几何形：梯形顶部 + 矩形主体） -->
  <!-- 文件夹顶部（tab） -->
  <path d="M240 380 L320 280 L704 280 L784 380 Z" fill="url(#folderGrad)" opacity="0.9"/>

  <!-- 文件夹主体 -->
  <rect x="200" y="380" width="624" height="380" rx="24" fill="url(#folderGrad)"/>

  <!-- 文件夹内层（浅色，代表内容区域） -->
  <rect x="240" y="420" width="544" height="300" rx="16" fill="url(#innerGrad)" opacity="0.15"/>

  <!-- 文件线条（文件夹内的文件列表抽象） -->
  <!-- 三条横线和一条竖线，构成文件列表图标 -->
  <rect x="280" y="460" width="320" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  <rect x="280" y="490" width="280" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="280" y="520" width="240" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

  <rect x="280" y="560" width="320" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  <rect x="280" y="590" width="280" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="280" y="620" width="240" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

  <!-- 右侧竖线（代表文件/目录分隔） -->
  <rect x="660" y="440" width="4" height="220" rx="2" fill="#ffffff" opacity="0.4"/>

  <!-- Z 字形（Zashiki 的首字母，同时也是折叠/路径的隐喻） -->
  <polyline points="520,300 720,300 560,500 760,500"
            fill="none"
            stroke="#ffffff"
            stroke-width="32"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.95"/>
</svg>
