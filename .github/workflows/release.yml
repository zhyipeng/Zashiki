name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  APP_NAME: Zashiki
  WAILS_VERSION: v3.0.0-alpha.97

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            artifact-name: zashiki-darwin-universal
            artifact-file: Zashiki-darwin-universal.zip
          - platform: windows
            os: windows-latest
            artifact-name: zashiki-windows-amd64
            artifact-file: Zashiki-windows-amd64.zip
          - platform: linux
            os: ubuntu-latest
            artifact-name: zashiki-linux-amd64
            artifact-file: Zashiki-linux-amd64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev

      - name: Install build tools
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build macOS app
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          task darwin:package:universal
          ditto -c -k --sequesterRsrc --keepParent "bin/${APP_NAME}.app" "${{ matrix.artifact-file }}"

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          task windows:build ARCH=amd64
          7z a "${{ matrix.artifact-file }}" "./bin/${APP_NAME}.exe"

      - name: Build Linux binary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          task linux:build ARCH=amd64
          tar -czf "${{ matrix.artifact-file }}" -C bin "${APP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-file }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
