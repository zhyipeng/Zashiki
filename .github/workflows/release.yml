name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  APP_NAME: Zashiki
  WAILS_VERSION: v3.0.0-beta.12

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            os: macos-latest
            artifact-name: zashiki-darwin-universal
            artifact-file: Zashiki.dmg
            artifact-path: bin/*.dmg
          - platform: windows
            os: windows-latest
            artifact-name: zashiki-windows-amd64
            artifact-file: Zashiki-amd64-installer.exe
            artifact-path: bin/*-installer.exe
          - platform: linux
            os: ubuntu-latest
            artifact-name: zashiki-linux-amd64
            artifact-file: Zashiki-linux-amd64
            artifact-path: |
              bin/*.deb
              bin/*.rpm
              bin/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev

      - name: Install build tools
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> "$env:GITHUB_PATH"

      # macOS now ships a real DMG installer (enabled since v3.0.0). The
      # package:dmg task builds the universal .app then wraps it in a styled
      # disk image that users can double-click to install.
      - name: Build macOS DMG
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          task darwin:package:dmg

      # Windows ships a per-user NSIS installer (Zashiki-amd64-installer.exe).
      # It installs under %LOCALAPPDATA% without a UAC prompt, and adds a detached
      # launcher to the user PATH (removed again on uninstall), so `zashiki` is
      # available from a new terminal without holding it open.
      - name: Build Windows NSIS installer
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          task windows:package ARCH=amd64 INSTALL_SCOPE=user

      # Linux ships deb + rpm + AppImage installers. `create:appimage` invokes
      # linuxdeploy, which downloads an AppImage; set APPIMAGE_EXTRACT_AND_RUN
      # because Ubuntu runners do not ship libfuse2 anymore.
      - name: Build Linux installers
        if: matrix.platform == 'linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          task linux:create:deb
          task linux:create:rpm
          task linux:create:appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
