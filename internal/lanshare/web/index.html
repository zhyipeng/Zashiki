<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zashiki 快传</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2329; --muted: #8a9099;
    --primary: #18a058; --primary-weak: #e8f7ef; --border: #e5e7eb;
    --danger: #d03050; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014; --card: #1b1c20; --text: #e6e7ea; --muted: #8a9099;
      --primary: #2bb46a; --primary-weak: #16301f; --border: #2c2e33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 12px 40px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { text-align: center; padding: 12px 0 20px; }
  .header h1 { margin: 0; font-size: 22px; }
  .header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .thumb {
    width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--primary-weak); display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 11px;
  }
  .item-main { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; word-break: break-all; }
  .item-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .text-body {
    background: var(--primary-weak); border-radius: 8px; padding: 10px 12px;
    font-size: 13px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto;
  }
  button {
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    background: var(--primary); color: #fff; flex-shrink: 0;
  }
  button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  button:disabled { opacity: .5; cursor: default; }
  .dropzone {
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px 12px;
    text-align: center; color: var(--muted); font-size: 13px; transition: border-color .15s;
  }
  .dropzone.over { border-color: var(--primary); color: var(--primary); }
  textarea {
    width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--text);
  }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: var(--primary); width: 0; transition: width .2s; }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .download-task { padding: 10px 0; border-top: 1px solid var(--border); }
  .download-task:first-child { border-top: none; }
  .download-task-head { display: flex; align-items: center; gap: 8px; }
  .download-task-name { flex: 1; min-width: 0; font-size: 13px; word-break: break-all; }
  .download-task-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .download-task-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .download-task-actions button { padding: 5px 10px; font-size: 12px; }
  .tip { color: var(--muted); font-size: 12px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Zashiki 快传</h1>
    <p>同一局域网内与 Zashiki 互传文件和文本</p>
  </div>

  <div class="card">
    <h2>共享的文件 <button id="zip-all" class="ghost" style="display:none">全部下载</button></h2>
    <div id="file-list"><div class="empty">暂无共享文件</div></div>
    <div id="download-progress"></div>
  </div>

  <div class="card">
    <h2>共享的文本</h2>
    <div id="text-list"><div class="empty">暂无共享文本</div></div>
  </div>

  <div class="card">
    <h2>发送文件到 Zashiki</h2>
    <div id="dropzone" class="dropzone">点击选择或拖拽文件到这里</div>
    <input id="file-input" type="file" multiple hidden>
    <div id="upload-progress"></div>
    <div class="tip">文件将保存到 Zashiki 的接收目录</div>
  </div>

  <div class="card">
    <h2>发送文本到 Zashiki</h2>
    <textarea id="text-input" placeholder="输入要发送的文本…"></textarea>
    <div class="row"><button id="text-send">发送</button></div>
  </div>
</div>

<script type="module">
import {
  completedBytes,
  discardDownload,
  listDownloadTasks,
  planRanges,
  startDownload,
} from './download.js';

(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var pollTimer = null;
  var currentItems = [];
  var storedTasks = [];
  var downloadStates = Object.create(null);
  var activeDownloads = Object.create(null);
  var stateTimers = Object.create(null);

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    var units = ['KB', 'MB', 'GB', 'TB'];
    var value = bytes, unit = -1;
    do { value /= 1024; unit++; } while (value >= 1024 && unit < units.length - 1);
    return (value >= 100 ? Math.round(value) : value.toFixed(1)) + ' ' + units[unit];
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function fileItem(itemId) {
    return currentItems.find(function (item) { return item.id === itemId; }) || null;
  }

  function taskDoneBytes(task) {
    var ranges = planRanges(task.size, task.chunkSize);
    return completedBytes(ranges, task.completed || []);
  }

  function stateForStoredTask(task) {
    var item = fileItem(task.itemId);
    return {
      id: task.itemId,
      name: task.name,
      item: item,
      phase: 'paused',
      doneBytes: taskDoneBytes(task),
      totalBytes: task.size,
      error: '',
      retry: '',
    };
  }

  function statePercent(state) {
    if (state.phase === 'done') return 100;
    if (!state.totalBytes) return 0;
    return Math.min(100, Math.floor((state.doneBytes / state.totalBytes) * 100));
  }

  function stateText(state) {
    if (state.phase === 'running') return state.retry || ('下载中 ' + statePercent(state) + '%');
    if (state.phase === 'paused') return '已暂停，可继续';
    if (state.phase === 'error') return state.error || '下载失败，可重试';
    if (state.phase === 'native') return '已交给浏览器原生下载';
    if (state.phase === 'done') return '完成';
    return '';
  }

  function stateBytesText(state) {
    if (!state.totalBytes) return '';
    return formatBytes(state.doneBytes) + ' / ' + formatBytes(state.totalBytes);
  }

  function scheduleStateRemoval(id) {
    if (stateTimers[id]) clearTimeout(stateTimers[id]);
    stateTimers[id] = setTimeout(function () {
      delete downloadStates[id];
      delete stateTimers[id];
      renderDownloadTasks();
      renderItems(currentItems);
    }, 8000);
  }

  function renderDownloadTasks() {
    var box = $('download-progress');
    box.textContent = '';
    var byId = Object.create(null);
    storedTasks.forEach(function (task) {
      byId[task.itemId] = stateForStoredTask(task);
    });
    Object.keys(downloadStates).forEach(function (id) {
      byId[id] = downloadStates[id];
    });
    var states = Object.keys(byId).map(function (id) { return byId[id]; });
    if (states.length === 0) return;

    var title = el('div', 'item-sub', '下载任务');
    title.style.marginTop = '12px';
    box.appendChild(title);
    states.forEach(function (state) {
      var entry = el('div', 'download-task');
      var head = el('div', 'download-task-head');
      head.appendChild(el('div', 'download-task-name', state.name));
      entry.appendChild(head);

      if (state.phase === 'running' || state.phase === 'paused' || state.phase === 'error') {
        var progress = el('div', 'progress');
        var inner = el('div');
        inner.style.width = statePercent(state) + '%';
        progress.appendChild(inner);
        entry.appendChild(progress);
      }

      var meta = el('div', 'download-task-meta', stateText(state));
      var bytes = stateBytesText(state);
      if (bytes) meta.textContent += ' · ' + bytes;
      entry.appendChild(meta);

      var actions = el('div', 'download-task-actions');
      if (state.phase === 'running') {
        var cancel = el('button', 'ghost', '取消');
        cancel.addEventListener('click', function () { cancelDownload(state.id); });
        actions.appendChild(cancel);
      } else if ((state.phase === 'paused' || state.phase === 'error') && state.item) {
        var resume = el('button', '', state.phase === 'error' ? '重试' : '继续');
        resume.addEventListener('click', function () { beginDownload(state.item); });
        actions.appendChild(resume);
      }
      if (state.phase !== 'running' && state.phase !== 'native' && state.phase !== 'done') {
        var clear = el('button', 'ghost', '清除');
        clear.addEventListener('click', function () { clearDownload(state.id); });
        actions.appendChild(clear);
      }
      if (actions.childNodes.length > 0) entry.appendChild(actions);
      box.appendChild(entry);
    });
  }

  function syncStoredTasks() {
    return listDownloadTasks().then(function (tasks) {
      storedTasks = tasks || [];
      renderDownloadTasks();
      renderItems(currentItems);
    }).catch(function () {
      storedTasks = [];
    });
  }

  function beginDownload(item) {
    if (!item || item.kind !== 'file' || activeDownloads[item.id]) return;
    if (stateTimers[item.id]) {
      clearTimeout(stateTimers[item.id]);
      delete stateTimers[item.id];
    }
    downloadStates[item.id] = {
      id: item.id,
      name: item.name,
      item: item,
      phase: 'running',
      doneBytes: 0,
      totalBytes: item.size,
      error: '',
      retry: '',
    };
    renderDownloadTasks();
    renderItems(currentItems);

    var handle = startDownload(item, {
      onRetry: function (info) {
        var state = downloadStates[item.id];
        if (!state) return;
        state.retry = '正在重试分片 ' + (info.part.index + 1) + '（' + info.attempt + '/' + info.maxRetries + '）';
        renderDownloadTasks();
      },
      onState: function (next) {
        var state = downloadStates[item.id] || {
          id: item.id, name: item.name, item: item, error: '', retry: ''
        };
        state.phase = next.phase || state.phase;
        state.doneBytes = next.doneBytes ?? state.doneBytes ?? 0;
        state.totalBytes = next.totalBytes ?? state.totalBytes ?? item.size;
        state.error = next.error || '';
        if (state.phase !== 'running') state.retry = '';
        downloadStates[item.id] = state;
        renderDownloadTasks();
        renderItems(currentItems);
      },
    });
    activeDownloads[item.id] = handle;
    handle.promise.then(function (result) {
      var state = downloadStates[item.id];
      if (!state) return;
      if (result && result.mode === 'native') {
        state.phase = 'native';
      } else {
        state.phase = 'done';
        state.doneBytes = state.totalBytes;
      }
      state.retry = '';
      renderDownloadTasks();
      renderItems(currentItems);
      if (state.phase === 'done' || state.phase === 'native') scheduleStateRemoval(item.id);
    }).catch(function (err) {
      var state = downloadStates[item.id];
      if (!state) return;
      state.phase = err && err.code === 'cancelled' ? 'paused' : 'error';
      state.error = err && err.message ? err.message : '下载失败';
      state.retry = '';
      renderDownloadTasks();
      renderItems(currentItems);
    }).finally(function () {
      delete activeDownloads[item.id];
      syncStoredTasks();
    });
  }

  function cancelDownload(itemId) {
    var handle = activeDownloads[itemId];
    if (handle) handle.cancel();
  }

  function clearDownload(itemId) {
    var handle = activeDownloads[itemId];
    var stopped = handle ? handle.promise.catch(function () {}) : Promise.resolve();
    if (handle) handle.cancel();
    stopped.then(function () { return discardDownload(itemId); }).then(function () {
      delete downloadStates[itemId];
      syncStoredTasks();
    }).catch(function () {});
  }

  function renderItems(items) {
    currentItems = items || [];
    var files = items.filter(function (it) { return it.kind === 'file'; });
    var texts = items.filter(function (it) { return it.kind === 'text'; });

    var fileList = $('file-list');
    fileList.textContent = '';
    if (files.length === 0) {
      fileList.appendChild(el('div', 'empty', '暂无共享文件'));
    }
    files.forEach(function (item) {
      var row = el('div', 'item');
      if (item.isImage) {
        var img = document.createElement('img');
        img.className = 'thumb';
        img.alt = '';
        img.src = 'download/' + encodeURIComponent(item.id) + '?preview=1';
        row.appendChild(img);
      } else {
        row.appendChild(el('div', 'thumb', '文件'));
      }
      var main = el('div', 'item-main');
      main.appendChild(el('div', 'item-name', item.name));
      main.appendChild(el('div', 'item-sub', formatBytes(item.size)));
      row.appendChild(main);
      var state = downloadStates[item.id];
      var btn = el('button', '', state && state.phase === 'running' ? '下载中' : '下载');
      btn.disabled = !!(state && state.phase === 'running');
      btn.addEventListener('click', function () {
        beginDownload(item);
      });
      row.appendChild(btn);
      fileList.appendChild(row);
    });
    $('zip-all').style.display = files.length > 1 ? '' : 'none';
    renderDownloadTasks();

    var textList = $('text-list');
    textList.textContent = '';
    if (texts.length === 0) {
      textList.appendChild(el('div', 'empty', '暂无共享文本'));
    }
    texts.forEach(function (item) {
      var row = el('div', 'item');
      var main = el('div', 'item-main');
      main.appendChild(el('div', 'item-name', item.name));
      var body = el('div', 'text-body', item.text);
      body.style.marginTop = '6px';
      main.appendChild(body);
      row.appendChild(main);
      var btn = el('button', 'ghost', '复制');
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(item.text).then(function () {
          btn.textContent = '已复制';
          setTimeout(function () { btn.textContent = '复制'; }, 1200);
        });
      });
      row.appendChild(btn);
      textList.appendChild(row);
    });
  }

  function poll() {
    fetch('items', { cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) { if (data && data.items) renderItems(data.items); })
      .catch(function () {});
  }

  function addUploadProgress(name, xhr) {
    var box = $('upload-progress');
    var entry = el('div');
    var label = el('div', 'item-name', name);
    var bar = el('div', 'progress');
    var inner = el('div');
    bar.appendChild(inner);
    var status = el('div', 'progress-label', '上传中…');
    entry.appendChild(label);
    entry.appendChild(bar);
    entry.appendChild(status);
    box.appendChild(entry);

    xhr.upload.addEventListener('progress', function (e) {
      if (e.lengthComputable) {
        var pct = Math.floor((e.loaded / e.total) * 100);
        inner.style.width = pct + '%';
        status.textContent = '上传中 ' + pct + '%';
      }
    });
    xhr.addEventListener('load', function () {
      if (xhr.status === 200) {
        inner.style.width = '100%';
        status.textContent = '完成';
      } else {
        status.textContent = '失败（' + xhr.status + '）';
      }
    });
    xhr.addEventListener('error', function () { status.textContent = '失败'; });
    setTimeout(function () { entry.remove(); }, 8000);
  }

  function uploadFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    files.forEach(function (file) {
      var form = new FormData();
      form.append('files', file, file.name);
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'upload');
      addUploadProgress(file.name, xhr);
      xhr.send(form);
    });
  }

  function bindUpload() {
    var zone = $('dropzone');
    var input = $('file-input');
    zone.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      uploadFiles(input.files);
      input.value = '';
    });
    ['dragenter', 'dragover'].forEach(function (name) {
      zone.addEventListener(name, function (e) {
        e.preventDefault();
        zone.classList.add('over');
      });
    });
    ['dragleave', 'drop'].forEach(function (name) {
      zone.addEventListener(name, function (e) {
        e.preventDefault();
        zone.classList.remove('over');
      });
    });
    zone.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files) uploadFiles(e.dataTransfer.files);
    });
  }

  function bindText() {
    $('text-send').addEventListener('click', function () {
      var input = $('text-input');
      var text = input.value;
      if (!text.trim()) return;
      var btn = $('text-send');
      btn.disabled = true;
      fetch('text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      }).then(function (res) {
        if (res.ok) input.value = '';
      }).catch(function () {}).finally(function () {
        btn.disabled = false;
      });
    });
  }

  function bindZip() {
    $('zip-all').addEventListener('click', function () {
      location.href = 'zip';
    });
  }

  bindUpload();
  bindText();
  bindZip();
  poll();
  syncStoredTasks();
  pollTimer = setInterval(poll, 3000);
  window.addEventListener('beforeunload', function () { clearInterval(pollTimer); });
})();
</script>
</body>
</html>
